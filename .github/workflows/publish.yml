name: Publish Mora

on:
    push:
        tags:
            - "app-v*"
    workflow_dispatch:
        inputs:
            release_tag:
                description: "Exact app-vX.Y.Z tag for the Draft Release"
                required: true
                type: string

permissions:
    contents: write

env:
    RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
    verify:
        name: Verify release source
        runs-on: ubuntu-22.04

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y fonts-noto-cjk libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: "./src-tauri -> target"

            - name: Install frontend dependencies
              run: npm ci

            - name: Verify release version
              run: npm run release:check

            - name: Run frontend tests
              run: npm test

            - name: Lint source
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Build frontend
              run: npm run build

            - name: Prepare mora-agent test sidecar
              env:
                  TAURI_ENV_DEBUG: "true"
              run: npm run prepare:agent

            - name: Run Rust tests
              run: cargo test --manifest-path src-tauri/Cargo.toml --features agent-bin

            - name: Check Rust source
              run: cargo check --manifest-path src-tauri/Cargo.toml

    publish:
        name: Build ${{ matrix.label }} release
        needs: verify
        runs-on: ${{ matrix.platform }}
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                include:
                    - label: Windows x64
                      platform: windows-latest
                      target: x86_64-pc-windows-msvc
                      args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"
                    - label: macOS Apple Silicon
                      platform: macos-latest
                      target: aarch64-apple-darwin
                      args: "--target aarch64-apple-darwin --bundles app,dmg"
                    - label: macOS Intel
                      platform: macos-latest
                      target: x86_64-apple-darwin
                      args: "--target x86_64-apple-darwin --bundles app,dmg"
                    - label: Linux x64
                      platform: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      args: "--target x86_64-unknown-linux-gnu --bundles appimage,deb"

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: "./src-tauri -> target"

            - name: Install frontend dependencies
              run: npm ci

            - name: Prepare target-specific mora-agent sidecar
              env:
                  TAURI_ENV_DEBUG: "true"
              run: npm run prepare:agent -- --target ${{ matrix.target }}

            - name: Check target-specific Rust source
              run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

            - name: Build Draft Release and updater metadata
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: ${{ env.RELEASE_TAG }}
                  releaseName: "Mora __VERSION__"
                  releaseBody: |
                      ## 下载与安装

                      - Windows x64：下载 `x64-setup.exe`（推荐）或 `x64_zh-CN.msi`。
                      - macOS Apple Silicon（M1 及后续芯片）：下载 `aarch64.dmg`。
                      - macOS Intel：下载 `x64.dmg`。
                      - Linux x64：下载 `.AppImage` 或 `.deb`。

                      ### macOS 首次启动

                      本版本使用 ad-hoc 签名，未经过 Apple Developer 公证。将 `Mora.app` 拖入“应用程序”后，如果 macOS 阻止启动：

                      1. 前往“系统设置 → 隐私与安全性 → 仍要打开”。
                      2. 如果仍提示“应用已损坏”，在终端执行：

                         `xattr -dr com.apple.quarantine "/Applications/Mora.app"`

                      3. 重新打开 Mora。
                  generateReleaseNotes: true
                  releaseDraft: true
                  prerelease: false
                  uploadUpdaterJson: true
                  updaterJsonPreferNsis: true
                  retryAttempts: 3
                  args: ${{ matrix.args }}

            - name: Verify mora-agent sidecar
              run: node scripts/prepare-agent-sidecar.mjs --check --target ${{ matrix.target }}
