[package]
name = "mora"
version = "0.1.0"
description = "Mora 墨笺 desktop MDX note editor"
authors = ["Mora"]
edition = "2021"

[lib]
name = "mdxnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = "0.6.6"
base64 = "0.22"
eventsource-stream = "0.2.3"
futures-util = "0.3.33"
keyring = "4.1.5"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "sync"] }
url = "2.5.8"
regex = "1"
pulldown-cmark = "0.13.4"
docx-rs = "0.4.22"
typst-as-lib = { version = "0.16.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15"
typst = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
lopdf = "0.42.0"
