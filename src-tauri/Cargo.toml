[package]
name = "mora"
version = "0.1.1"
description = "Mora 墨笺 desktop MDX note editor"
authors = ["Mora"]
edition = "2021"
default-run = "mora"

[lib]
name = "mdxnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = "0.6.6"
base64 = "0.22"
eventsource-stream = "0.2.3"
futures-util = "0.3.33"
keyring = "4.1.5"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "sync", "rt-multi-thread", "net", "io-util", "io-std", "time", "signal"] }
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
url = "2.5.8"
regex = "1"
notify = "8.2.0"
rmcp = { version = "3.1.4", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
pulldown-cmark = "0.13.4"
docx-rs = "0.4.22"
fontdb = "0.23.0"
typst-as-lib = { version = "0.16.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.15"
typst = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
lopdf = "0.42.0"

[[bin]]
name = "mora-agent"
path = "src/bin/mora-agent.rs"
