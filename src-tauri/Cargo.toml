[package]
name = "mora"
version = "0.1.0"
description = "Mora 墨笺 desktop MDX note editor"
authors = ["Mora"]
edition = "2021"

[lib]
name = "mdxnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = "0.6.6"
base64 = "0.22"
